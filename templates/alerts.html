{% for message in messages %}
    <div id="alert-{{ forloop.counter }}"
         class="flex items-center p-4 mb-4 text-sm rounded-base
         {% if message.level_tag == 'success' %}text-fg-success-strong bg-success-soft
         {% elif message.level_tag == 'error' %}text-fg-danger-strong bg-danger-soft
         {% elif message.level_tag == 'warning' %}text-fg-warning bg-warning-soft
         {% else %}text-fg-brand-strong bg-brand-softer{% endif %}"
         role="alert">
        <svg class="w-4 h-4 shrink-0" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
             width="24" height="24" fill="none" viewBox="0 0 24 24">
            {% if message.level_tag == 'success' %}
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8.5 11.5 11 14l4-4m6 2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
            {% else %}
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M10 11h2v5m-2 0h4m-2.592-8.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
            {% endif %}
        </svg>
        <span class="sr-only">{{ message.level_tag|title }}</span>
        <div class="ms-2 text-sm">{{ message }}</div>
        <button type="button"
                class="ms-auto -mx-1.5 -my-1.5 rounded p-1.5 inline-flex items-center justify-center h-8 w-8 shrink-0 focus:ring-2
                {% if message.level_tag == 'success' %}focus:ring-success-medium hover:bg-success-medium
                {% elif message.level_tag == 'error' %}focus:ring-danger-medium hover:bg-danger-medium
                {% elif message.level_tag == 'warning' %}focus:ring-warning-medium hover:bg-warning-medium
                {% else %}focus:ring-brand-medium hover:bg-brand-soft{% endif %}"
                data-dismiss-target="#alert-{{ forloop.counter }}" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="w-4 h-4" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                 fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M6 18 17.94 6M18 18 6.06 6"/>
            </svg>
        </button>
    </div>
{% endfor %}
